<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>無名之戰．雙盲推演</title>
<style>
  :root{ --ink:#2b2118; --paper:#f4ecd8; --red:#b3261e; --blue:#1f4e9c; --gold:#b8892b; --line:#cdb88f; --dockR:0px }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d1a15;color:var(--ink);
    font-family:"Noto Serif TC","Source Han Serif TC","PingFang TC","Microsoft JhengHei",serif}
  button{font-family:inherit;cursor:pointer}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ddd;font-size:16px;background:#111;z-index:50}
  .muted{color:#7a6a50;font-size:13px;line-height:1.5}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  /* 頂列（只蓋在地圖上方，不壓到面板） */
  #top{position:fixed;top:0;left:0;right:var(--dockR);height:44px;display:flex;align-items:center;gap:6px;padding:0 10px;
    background:linear-gradient(#2b2118f2,#2b2118b0);color:var(--paper);z-index:5;white-space:nowrap;overflow:hidden}
  #top .side{font-weight:700;padding:3px 10px;border-radius:6px;flex:0 0 auto}
  #top .side.red{background:var(--red)} #top .side.blue{background:var(--blue)} #top .side.ref{background:var(--gold)}
  #top .room{flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
  #top .grow{flex:1 1 0;min-width:0}
  #top button{flex:0 0 auto;font-size:13px;padding:5px 9px;border-radius:6px;border:1px solid var(--line);background:rgba(244,236,216,.95);color:var(--ink)}
  @media (max-width:700px){ #top{padding:0 6px;gap:4px} #top .room{display:none} #top button{padding:5px 6px;font-size:12px} #top .side{padding:3px 7px;font-size:14px} }
  #banner{position:fixed;left:calc((100vw - var(--dockR))/2);transform:translateX(-50%);top:48px;white-space:nowrap;z-index:4;background:#7a3b10;color:#fff;font-size:11px;padding:2px 8px;border-radius:6px;opacity:.85;pointer-events:none}
  #toast{position:fixed;left:calc((100vw - var(--dockR))/2);transform:translateX(-50%);top:54px;max-width:calc(100vw - var(--dockR) - 24px);z-index:25;background:#1d8c4a;color:#fff;font-weight:700;font-size:15px;line-height:1.4;padding:8px 16px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.4);display:none;text-align:center;width:max-content}

  /* 按鈕 */
  .btn{font-size:14px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .btn.sm{padding:2px 8px;font-size:12px;margin-left:6px}
  .btn.main{display:block;background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;width:100%;padding:11px;margin-top:8px;font-size:15px}
  .btn.main.sent{background:#1d8c4a;border-color:#1d8c4a;color:#fff}
  .badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:8px;margin-left:5px;background:#dfeccf;color:#2f5a1a;vertical-align:1px}
  .badge.warn{background:#f6c9a0;color:#8a3a08}

  /* 學生面板：電腦與橫拿在右側窄欄，直拿在下方（最多約三分之一畫面）；可收合 */
  #panel{position:fixed;left:0;right:0;bottom:0;max-height:34vh;overflow:auto;background:var(--paper);border-top:3px solid var(--gold);
    padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:6;font-size:13px}
  .phead{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;margin-bottom:2px}
  .phead b{white-space:nowrap}
  .phead .muted{text-align:right;font-size:11.5px;line-height:1.3;flex:1 1 auto}
  .phead .tog{flex:0 0 auto;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .prest{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:12px;flex-wrap:wrap}
  .pbar{display:inline-flex;gap:2px} .pbar i{width:10px;height:10px;border-radius:2px;background:#e6dcc0;border:1px solid #b8a37a}
  .pbar i.on{background:#2f6fe0;border-color:#1d4aa8} .pbar i.on.low{background:#e0661f;border-color:#a8460f}
  .pnum{color:#1d4aa8} .pnum.low{color:#c0500f}
  .chips{display:flex;gap:4px;flex-wrap:wrap;padding:2px}
  .chip{flex:0 0 auto;padding:3px 7px;border:1px solid var(--line);border-radius:8px;background:#fffaf0;font-size:12.5px;line-height:1.4;border-left:4px solid var(--red);cursor:pointer}
  body.role-blue .chip{border-left-color:var(--blue)}
  .chip.sel{outline:2px solid var(--gold);background:#fff3c8}
  .chip .ord{color:#6b4e1f;font-size:12px}
  .opts{display:flex;gap:4px;flex-wrap:wrap;padding:2px;margin-top:3px}
  .opts button{flex:0 0 auto;font-size:13px;padding:5px 8px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .opts button.strike{border-color:#ff8a00;color:#b35a00}
  .opts button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  .opts button.on::before{content:"✓ "}
  .count{display:flex;align-items:center;gap:6px;font-size:13px;margin:4px 0 0;flex-wrap:wrap}
  .count button{width:30px;height:30px;font-size:16px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .count input{width:60px;font:inherit;padding:3px;border:1px solid var(--line);border-radius:6px;background:#fff}
  .hint{margin:4px 2px 0;font-size:12px}
  #panel .btn.main{padding:8px;margin-top:6px;font-size:14px}
  #panel #send{position:sticky;bottom:0;box-shadow:0 -5px 6px var(--paper)}
  .badge{font-size:10.5px;padding:0 5px;margin-left:4px}
  .badge.split{background:#ffe08a;color:#6b4a00}
  .teamhead{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:4px 2px 0;font-size:13px}
  .btn.sm.act{background:var(--ink);color:var(--paper);border-color:var(--ink);padding:3px 8px;font-size:12px;font-weight:700}
  .teamhead .btn.sm{padding:3px 8px;font-size:12px;margin-left:0}
  .teams{display:flex;flex-direction:column;gap:3px;margin:4px 2px 0}
  .team{display:flex;align-items:center;gap:6px;padding:2px 6px;border:1px solid var(--line);border-radius:7px;background:#fffaf0;font-size:13px;cursor:pointer}
  .team.sel{outline:2px solid var(--gold);background:#fff3c8}
  .team button{width:26px;height:24px;line-height:1;font-size:15px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);flex:0 0 auto}
  .team .tn{min-width:1.2em;text-align:center;font-size:14px}
  .team .ord{color:#6b4e1f;font-size:12px}
  .opts .who{align-self:center;font-weight:700;font-size:13px}
  .result{margin:4px 0;font-size:14px;line-height:1.5;color:#7a1a10}
  .waitnote{margin-top:6px;padding:5px 8px;border-radius:7px;background:#fff1c2;border:1px solid #e0b84a;font-size:12px;line-height:1.45}
  /* 兵力分配：每個去處一列 */
  .alloc{display:flex;flex-direction:column;gap:3px;margin:4px 2px 0}
  .arow2{display:flex;align-items:center;gap:5px;padding:3px 6px;border:1px solid var(--line);border-radius:7px;background:#fffaf0;font-size:13px}
  .arow2.on{background:#fff3c8;border-color:var(--gold)}
  .arow2.stay{background:#f3ead2}
  .arow2.strike .dst{color:#b35a00}
  .arow2 .dst{flex:1 1 auto;min-width:0;line-height:1.3}
  .arow2 .dst small{font-size:11px}
  .arow2 .pm{width:28px;height:26px;line-height:1;font-size:16px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);flex:0 0 auto}
  .arow2 .pm:disabled{opacity:.35}
  .arow2 .tn{min-width:1.4em;text-align:center;font-size:15px}
  .arow2 .all{flex:0 0 auto;font-size:12px;padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .arow2 .st{font-size:12px;padding:1px 6px;margin-left:3px;border-radius:5px;border:1px solid var(--line);background:#fff;color:var(--ink)}
  .arow2 .st.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  /* 收合：只留回合與送出鈕，浮在右下角，不佔地圖 */
  #panel.mini{left:auto;top:auto!important;right:8px;bottom:8px;width:auto;min-width:220px;max-width:300px;max-height:none;border:2px solid var(--gold);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.4)}
  #panel.mini .btn.main{margin-top:4px}
  /* 電腦與橫拿：右側窄欄 */
  @media (orientation: landscape) and (min-width: 600px){
    #panel{left:auto;top:0;width:300px;max-height:none;border-top:none;border-left:3px solid var(--gold)}
    .chips{flex-direction:column}
  }
  @media (orientation: landscape) and (max-height: 520px){
    #panel{width:min(270px,38vw)}
  }

  /* 裁判、投影面板：寬螢幕靠右，窄螢幕在下方 */
  #refbox,#screenbox{position:fixed;top:0;right:0;bottom:0;width:320px;overflow:auto;background:var(--paper);border-left:3px solid var(--gold);padding:8px 10px;z-index:6;font-size:13px;line-height:1.45}
  #screenbox{width:380px;font-size:16px}
  #screenbox .big{font-size:23px;font-weight:700;line-height:1.35;margin-bottom:6px}
  #refbox h4{margin:8px 0 3px;font-size:13.5px}
  .arow{padding:3px 7px;border:1px solid var(--line);border-radius:8px;background:#fffaf0;margin-bottom:4px}
  .arow .ord{display:block;color:#6b4e1f;font-size:13px}
  .qrs{display:flex;gap:8px;justify-content:space-between;text-align:center;font-size:12px}
  .qrs svg{width:88px;height:88px;background:#fff;padding:3px;border-radius:4px}
  .stat{display:flex;gap:6px;margin:8px 0 4px}
  .stat span{flex:1;text-align:center;padding:5px;border-radius:6px;font-size:13px;font-weight:700}
  .stat span.wait{background:#fff1c2;color:#7a5a08;border:1px solid #e0b84a} .stat span.ok{background:#1d8c4a;color:#fff;border:1px solid #1d8c4a}
  .stat span.ok::before{content:"✓ "}
  .auto{display:flex;gap:6px;align-items:center;margin-top:8px;font-size:13px}
  details{margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:#fffaf0}
  summary{cursor:pointer;font-weight:700}
  .legend{margin-top:8px}
  .log-turn{font-weight:700;margin-top:8px}
  #refbox p,#screenbox p{margin:5px 0}
  @media (max-width:820px){
    #refbox,#screenbox{top:auto;left:0;width:auto;max-height:36vh;border-left:none;border-top:3px solid var(--gold)}
  }

  /* 彈窗 */
  .modal{position:fixed;inset:0;background:rgba(20,15,10,.6);display:flex;align-items:center;justify-content:center;z-index:30;padding:14px}
  .modal .card{background:var(--paper);border:2px solid var(--gold);border-radius:12px;max-width:540px;width:100%;max-height:86vh;overflow:auto;padding:16px 18px}
  .modal h2{margin:0 0 8px;font-size:19px;line-height:1.4}
  .modal p{margin:6px 0;line-height:1.65}
  .reveal{margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff6dc;border:1px solid #d9b45a}
  .reveal h2{font-size:18px;margin:0 0 6px} .reveal .yw{font-size:14px;line-height:1.7}

  /* 首頁 */
  #home{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:40;background:radial-gradient(#3a2f22,#16120d)}
  #home .card{background:var(--paper);border:2px solid var(--gold);border-radius:14px;padding:22px;max-width:420px;width:92%}
  #home h1{margin:0 0 4px;font-size:26px}
  #home input{font:inherit;font-size:18px;padding:8px;width:100%;border-radius:8px;border:1px solid var(--line);margin:6px 0;text-transform:uppercase}
  #home .row .btn{padding:11px;font-weight:700}
  .hline{border-top:1px solid var(--line);margin:16px 0 8px}
  #net{position:fixed;left:8px;bottom:8px;z-index:28;font-size:12px;padding:3px 9px;border-radius:10px;background:#1d8c4a;color:#fff;transition:opacity .6s;pointer-events:none}
  #net.fade{opacity:0} #net.off{background:#b8860b} #net.err{background:#b3261e;max-width:80vw}
</style>
<link rel="stylesheet" href="world.css?v=10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="config.js?v=10"></script>
<script src="world.js?v=10"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body data-style="B">
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="loading">正在鋪設地形……</div>
<div id="top"></div>
<div id="ui"></div>

</body>
</html>
